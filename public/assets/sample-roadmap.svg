<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1521" viewBox="0 0 1100 1521" role="img" aria-labelledby="title desc"><title id="title">게임 기획 · 작은 게임부터 완성하기 진로 로드맵</title><desc id="desc">만드는 즐거움을 알아가는 8주. 평일에는 짧게, 주말에는 직접 만들어 봐.</desc><rect width="1100" height="1521" fill="#fcfbf6"/><g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><rect x="42" y="35" width="8" height="35" rx="4" fill="#417961"/><text x="66" y="68" fill="#4a765e" font-size="20" font-weight="700"><tspan x="66" dy="0">DREAM MAP  /  나의 다음 한 걸음</tspan></text><text x="62" y="116" fill="#173c2d" font-size="38" font-weight="700"><tspan x="62" dy="0">게임 기획 · 작은 게임부터 완성하기</tspan></text><text x="62" y="181" fill="#60716a" font-size="21" font-weight="400"><tspan x="62" dy="0">만드는 즐거움을 알아가는 8주. 평일에는 짧게, 주말에는 직접 만들어 봐.</tspan></text><text x="62" y="226" fill="#466a58" font-size="19" font-weight="600"><tspan x="62" dy="0">활용 시간  ·  주 3시간 · 평일 30분씩 두 번 + 주말 2시간</tspan></text><rect x="52" y="262" width="996" height="235" rx="22" fill="#e5eedf"/><circle cx="87" cy="286" r="25" fill="#fff"/><text x="87" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#365b45">01</text><text x="132" y="288" fill="#687766" font-size="17" font-weight="600"><tspan x="132" dy="0">1–2주</tspan></text><text x="132" y="321" fill="#263e36" font-size="27" font-weight="700"><tspan x="132" dy="0">좋아하는 게임 관찰하기</tspan></text><text x="132" y="374" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  좋아하는 게임 하나를 골라 재미있는 이유 3가지 적기</tspan></text><text x="132" y="410" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  게임의 목표·규칙·보상을 한 장에 정리하기</tspan></text><text x="132" y="455" fill="#526951" font-size="18" font-weight="600"><tspan x="132" dy="0">남길 것  →  나만의 게임 관찰 노트</tspan></text><rect x="52" y="519" width="996" height="235" rx="22" fill="#f4e8d2"/><circle cx="87" cy="543" r="25" fill="#fff"/><text x="87" y="550" text-anchor="middle" font-size="20" font-weight="700" fill="#365b45">02</text><text x="132" y="545" fill="#687766" font-size="17" font-weight="600"><tspan x="132" dy="0">3–4주</tspan></text><text x="132" y="578" fill="#263e36" font-size="27" font-weight="700"><tspan x="132" dy="0">작은 아이디어 구체화하기</tspan></text><text x="132" y="631" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  주인공과 목표를 정하고 종이에 장면 그려 보기</tspan></text><text x="132" y="667" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  완성할 수 있을 만큼 작은 게임 규칙 만들기</tspan></text><text x="132" y="712" fill="#526951" font-size="18" font-weight="600"><tspan x="132" dy="0">남길 것  →  한 장짜리 게임 기획서</tspan></text><rect x="52" y="776" width="996" height="235" rx="22" fill="#e4ebf2"/><circle cx="87" cy="800" r="25" fill="#fff"/><text x="87" y="807" text-anchor="middle" font-size="20" font-weight="700" fill="#365b45">03</text><text x="132" y="802" fill="#687766" font-size="17" font-weight="600"><tspan x="132" dy="0">5–6주</tspan></text><text x="132" y="835" fill="#263e36" font-size="27" font-weight="700"><tspan x="132" dy="0">직접 움직이는 게임 만들기</tspan></text><text x="132" y="888" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  익숙한 제작 도구로 핵심 기능 한 가지 구현하기</tspan></text><text x="132" y="924" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  플레이 가능한 짧은 첫 버전 완성하기</tspan></text><text x="132" y="969" fill="#526951" font-size="18" font-weight="600"><tspan x="132" dy="0">남길 것  →  1분 동안 해 볼 수 있는 게임</tspan></text><rect x="52" y="1033" width="996" height="235" rx="22" fill="#ede5f0"/><circle cx="87" cy="1057" r="25" fill="#fff"/><text x="87" y="1064" text-anchor="middle" font-size="20" font-weight="700" fill="#365b45">04</text><text x="132" y="1059" fill="#687766" font-size="17" font-weight="600"><tspan x="132" dy="0">7–8주</tspan></text><text x="132" y="1092" fill="#263e36" font-size="27" font-weight="700"><tspan x="132" dy="0">함께 해 보고 다듬기</tspan></text><text x="132" y="1145" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  친구 한 명에게 보여 주고 불편한 점 들어 보기</tspan></text><text x="132" y="1181" fill="#263e36" font-size="20" font-weight="400"><tspan x="132" dy="0">•  한 가지를 개선하고 과정을 기록하기</tspan></text><text x="132" y="1226" fill="#526951" font-size="18" font-weight="600"><tspan x="132" dy="0">남길 것  →  게임 첫 작품 + 제작 회고</tspan></text><text x="62" y="1316" fill="#173c2d" font-size="27" font-weight="700"><tspan x="62" dy="0">이번 주, 이 두근거림부터</tspan></text><text x="62" y="1365" fill="#263e36" font-size="21" font-weight="400"><tspan x="62" dy="0">□  좋아하는 게임 하나 고르기</tspan></text><text x="62" y="1403" fill="#263e36" font-size="21" font-weight="400"><tspan x="62" dy="0">□  관찰 노트를 쓸 시간 30분 잡기</tspan></text><text x="62" y="1461" fill="#728176" font-size="18" font-weight="400"><tspan x="62" dy="0">속도는 달라도 괜찮아. 해 본 뒤에 네 계획을 다시 고쳐 보자.</tspan></text></g></svg>